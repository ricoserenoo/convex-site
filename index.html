<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0D0C;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.lab{font-weight:500;text-transform:uppercase;letter-spacing:.2em;margin:0}
.disp{font-weight:900;letter-spacing:-.03em;word-spacing:.14em;line-height:.95;margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid #A49E92;outline-offset:3px}
header{background:#1A2B25;border-bottom:1px solid rgba(255,255,255,.12)}
header nav{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:18px 24px}
.logo{width:190px;display:block;color:#fff}.logo svg{width:100%;height:auto;display:block}
.links{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:center;margin-inline-start:auto}
.links a{font-size:12px;text-decoration:none;padding:10px 0}
.links a.cur{text-decoration:underline;text-underline-offset:7px}
.btn{display:inline-block;font-size:13px;text-decoration:none;background:#fff;color:#1A2B25;padding:18px 28px;border-radius:999px;font-weight:500;border:0;cursor:pointer}
.btn.out{background:transparent;color:#fff;border:1.5px solid #fff;padding:16.5px 28px}
.btn.dk{background:#1A2B25;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.sec{padding:80px 0}
.green{background:#1A2B25}.brown{background:#7F5434}.cream{background:#EFECE6;color:#0B0D0C}.olive{background:#58562F}
.h1{font-size:clamp(52px,9vw,140px)}.h2{font-size:clamp(34px,5vw,68px)}
.rule{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;margin-top:40px;padding-bottom:16px;border-bottom:1.5px solid #fff}
.lead{font-size:19px;line-height:1.6;color:rgba(255,255,255,.86);max-width:620px;margin:24px 0 0}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.lineup{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px}
.lineup div{padding:24px 0;border-bottom:1px solid rgba(255,255,255,.3);display:flex;align-items:baseline;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.card{border-radius:6px;padding:36px;display:flex;flex-direction:column;gap:20px}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px}
.card li{border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.proc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;border-top:1.5px solid #0B0D0C}
.proc li{padding-top:26px}.proc .n{font-size:42px;color:#7F5434}.proc b{display:block;margin:10px 0 6px;font-size:18px}.proc span{font-size:15px;line-height:1.6;color:#3B3A36}
.eco{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.eco div{border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:26px;min-height:170px}
.eco p{margin:10px 0 0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)}
.layout{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
form.f{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:46px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:20px}
legend{padding:0 0 12px;margin-bottom:20px;display:flex;align-items:baseline;gap:14px;width:100%;border-bottom:1.5px solid #0B0D0C;font-weight:900;font-size:28px;letter-spacing:-.03em}
legend i{font-style:normal;color:#7F5434;font-size:24px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.fl{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
.in{width:100%;min-height:52px;padding:14px 16px;border:1.5px solid #B9B3A7;border-radius:4px;background:#fff;color:#0B0D0C;font-size:16px;font-weight:400}
.in:focus{outline:none;border-color:#1A2B25;box-shadow:0 0 0 3px rgba(26,43,37,.18)}
.dk .in,.in.d{background:#14211C;color:#fff;border-color:rgba(255,255,255,.3)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid #B9B3A7;border-radius:999px;background:#fff;color:#0B0D0C;font-size:15px;cursor:pointer}
.chip input:checked+span{background:#1A2B25;border-color:#1A2B25;color:#fff}
.chip input:focus-visible+span{outline:2px solid #A49E92;outline-offset:3px}
.drop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border:1.5px dashed #1A2B25;border-radius:6px;background:#fff;padding:24px;cursor:pointer;font-weight:400;position:relative}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid #A49E92;outline-offset:3px}
.drop .pill{border:1.5px solid #1A2B25;border-radius:999px;padding:14px 20px;font-size:12px}
.hint{font-size:13px;font-weight:400;color:#58562F}
.err{margin:0;padding:14px 16px;border-radius:4px;background:#F6E3DF;color:#8A2318;font-size:15px;font-weight:500}
.ok{margin:0;padding:14px 16px;border-radius:4px;background:#DDE8DF;color:#1A2B25;font-size:15px;font-weight:500}
aside.side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px}
.panel{border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.steps li{padding-top:12px;border-top:3px solid rgba(0,0,0,.18);font-size:14px;font-weight:600;color:#58562F}
.steps li.on{border-top-color:#1A2B25;color:#0B0D0C}
.steps.dk li{border-top-color:rgba(255,255,255,.2);color:#A49E92}.steps.dk li.on{border-top-color:#fff;color:#fff}
.steps .lab{display:block;font-size:10px;margin-bottom:6px}
.box{border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:20px;max-width:720px}
.rules{list-style:none;margin:0;padding:0;border-top:1.5px solid #0B0D0C}
.rules li{display:flex;flex-wrap:wrap;gap:8px 32px;padding:26px 0;border-bottom:1px solid #D6D1C7}
.rules b{flex:0 1 240px;font-size:24px;font-weight:900;letter-spacing:-.03em}.rules span{flex:1 1 380px;font-size:17px;line-height:1.65;color:#2A2925}
.tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #B9B3A7;background:#fff;color:#0B0D0C;cursor:pointer;font-size:14px}
.tab.on{background:#1A2B25;color:#fff;border-color:#1A2B25}
.app{background:#fff;border-radius:6px;padding:24px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.app .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.app dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.app dt{color:#58562F;font-weight:600}.app dd{margin:0;word-break:break-word}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;background:#EFECE6;font-size:12px;font-weight:600}
.chat{background:#fff;border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:16px}
.msgs{display:flex;flex-direction:column;gap:14px;min-height:280px;max-height:55vh;overflow-y:auto}
.m{display:flex;flex-direction:column;gap:4px;max-width:85%}.m.me{align-self:flex-end;align-items:flex-end}
.m small{font-size:11px;color:#58562F}.m p{margin:0;padding:12px 16px;border-radius:12px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.send{display:flex;flex-wrap:wrap;gap:10px}.send .in{flex:1 1 220px;min-width:0}
footer{background:#1A2B25;border-top:1px solid rgba(255,255,255,.12)}
footer .wrap{padding-top:48px;padding-bottom:32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}
footer a{display:block;font-size:15px;text-decoration:none;padding:6px 0}
.copy{border-top:1px solid rgba(255,255,255,.14);padding:18px 24px 28px;font-size:11px;color:#A49E92}
[hidden]{display:none!important}
</style>

      f.querySelector(".err").hidden = true; out.textContent = "";
      if (!sb) { showErr(f, "La plateforme n'est pas encore connectée au serveur."); return; }
      var r = await sb.rpc("track_application", { p_ref: f.ref.value, p_email: f.email.value });
      if (r.error) { showErr(f, "Erreur : " + r.error.message); return; }
      if (!r.data || !r.data.length) { showErr(f, "Aucun dossier trouvé avec cette référence et cet email."); return; }
      var d = r.data[0], i = ST.indexOf(d.status);
      out.appendChild(h("div", { class: "app" },
        h("div", { class: "top" }, h("b", { style: "font-size:22px", text: d.artist }), h("span", { class: "tag", text: (d.kind === "battle" ? "Battle B2B" : "Proposer un set") + " · " + fmt(d.created_at) })),
        stepper(i, false),
        h("p", { style: "margin:0;font-size:16px;line-height:1.6", text: AUTO[d.status] }),
        d.reply ? h("div", { class: "ok" }, h("b", { text: "Message de l'équipe : " }), d.reply) : null));
    });
  }

  /* ---------- espace équipe ---------- */
  async function teamPage() {
    var box = document.getElementById("team");
    if (!sb) { box.appendChild(notConnected()); return; }
    var s = (await sb.auth.getSession()).data.session;
    if (!s) { loginView(box); return; }
    dashboard(box, s.user);
  }
  function loginView(box) {
    var err = h("p", { class: "err", role: "alert", hidden: "hidden" });
    var f = h("form", { style: "max-width:460px;display:flex;flex-direction:column;gap:20px", onsubmit: async function (e) {
      e.preventDefault(); err.hidden = true;
      var r = await sb.auth.signInWithPassword({ email: f.email.value, password: f.password.value });
      if (r.error) { err.hidden = false; err.textContent = "Connexion impossible : email ou mot de passe incorrect."; return; }
      box.replaceChildren(); dashboard(box, r.data.user);
    } },
      h("label", { class: "fl" }, "Email", h("input", { class: "in", name: "email", type: "email", required: "required", autocomplete: "username" })),
      h("label", { class: "fl" }, "Mot de passe", h("input", { class: "in", name: "password", type: "password", required: "required", autocomplete: "current-password" })),
      err,
      h("div", {}, h("button", { class: "btn dk lab", type: "submit", text: "Se connecter" })),
      h("p", { class: "hint", text: "Accès réservé à l'équipe. Les comptes sont créés par Rico." }));
    box.replaceChildren(f);
  }
  async function dashboard(box, user) {
    var p = (await sb.from("profiles").select("name").eq("id", user.id).maybeSingle()).data;
    if (!p) { pickName(box, user); return; }
    var me = p.name;
    var bar = h("div", { style: "display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px" },
      h("p", { style: "margin:0;font-size:16px" }, "Connecté en tant que ", h("b", { text: me })),
      h("button", { class: "tab", text: "Se déconnecter", onclick: async function () { await sb.auth.signOut(); box.replaceChildren(); loginView(box); } }));
    var banner = h("p", { class: "ok", hidden: "hidden", style: "margin-bottom:16px" });
    var tabs = h("div", { class: "tabs" });
    var panelApps = h("div"), panelChat = h("div", { hidden: "hidden" });
    var tA = h("button", { class: "tab on", text: "Candidatures", onclick: function () { sel(0); } });
    var tC = h("button", { class: "tab", text: "Chat équipe", onclick: function () { sel(1); } });
    function sel(i) { tA.className = "tab" + (i === 0 ? " on" : ""); tC.className = "tab" + (i === 1 ? " on" : ""); panelApps.hidden = i !== 0; panelChat.hidden = i !== 1; }
    tabs.appendChild(tA); tabs.appendChild(tC);
    box.replaceChildren(bar, banner, tabs, panelApps, panelChat);
    appsPanel(panelApps, banner);
    chatPanel(panelChat, user, me);
  }
  async function pickName(box, user) {
    var err = h("p", { class: "err", hidden: "hidden" });
    var row = h("div", { class: "row", style: "margin-top:0" });
    ["ID", "Rico", "Ayla"].forEach(function (n) {
      row.appendChild(h("button", { class: "btn dk lab", text: n, onclick: async function () {
        var r = await sb.from("profiles").insert({ id: user.id, name: n });
        if (r.error) { err.hidden = false; err.textContent = "Ce nom est déjà pris ou impossible à enregistrer."; return; }
        box.replaceChildren(); dashboard(box, user);
      } }));
    });
    box.replaceChildren(h("p", { style: "font-size:18px", text: "Première connexion : qui es-tu ?" }), row, err);
  }
  function appsPanel(panel, banner) {
    var list = h("div");
    var filter = h("select", { class: "in", style: "max-width:260px;margin-bottom:20px", onchange: load });
    [["", "Tous les statuts"], ["recu", "Reçu"], ["en_cours", "En cours"], ["traite", "Traité"], ["reponse", "Réponse envoyée"]].forEach(function (o) { filter.appendChild(h("option", { value: o[0], text: o[1] })); });
    panel.appendChild(filter); panel.appendChild(list);
    async function load() {
      var q = sb.from("applications").select("*").order("created_at", { ascending: false });
      if (filter.value) q = q.eq("status", filter.value);
      var r = await q;
      list.replaceChildren();
      if (r.error) { list.appendChild(h("p", { class: "err", text: r.error.message })); return; }
      if (!r.data.length) list.appendChild(h("p", { text: "Aucune candidature pour l'instant." }));
      r.data.forEach(function (a) { list.appendChild(card(a)); });
    }
    function card(a) {
      var dl = h("dl", {});
      function add(k, v) {
        if (!v) return;
        var dd = h("dd", {});
        if (/^https?:[/][/]/.test(v)) dd.appendChild(h("a", { href: v, target: "_blank", rel: "noopener", text: v, style: "color:#1A2B25" }));
        else dd.textContent = v;
        dl.appendChild(h("dt", { text: k })); dl.appendChild(dd);
      }
      add("Nom", a.full_name); add("Email", a.email); add("Téléphone", a.phone); add("Instagram", a.instagram);
      Object.keys(a.payload || {}).forEach(function (k) { add(LABELS[k] || k, a.payload[k]); });
      var status = h("select", { class: "in", style: "max-width:240px", onchange: async function () {
        var r = await sb.from("applications").update({ status: status.value }).eq("id", a.id);
        msg.textContent = r.error ? "Erreur : " + r.error.message : "Statut mis à jour.";
      } });
      ST.forEach(function (s) { var o = h("option", { value: s, text: STL[s] }); if (s === a.status) o.selected = true; status.appendChild(o); });
      var reply = h("textarea", { class: "in", rows: "2", placeholder: "Message visible par le candidat sur la page Suivi", style: "min-height:70px" });
      reply.value = a.reply || "";
      var msg = h("span", { class: "hint" });
      return h("article", { class: "app" },
        h("div", { class: "top" }, h("b", { style: "font-size:20px", text: a.artist }), h("span", { class: "tag", text: (a.kind === "battle" ? "Battle B2B" : "Set") + " · " + a.ref + " · " + fmt(a.created_at) })),
        dl,
        h("div", { style: "display:flex;flex-wrap:wrap;gap:10px;align-items:center" },
          h("button", { class: "btn dk lab", style: "padding:14px 22px", text: "Voir la vidéo", onclick: async function () {
            var r = await sb.storage.from("videos").createSignedUrl(a.video_path, 3600);
            if (r.error) { msg.textContent = "Vidéo introuvable : " + r.error.message; return; }
            window.open(r.data.signedUrl, "_blank", "noopener");
          } }), status),
        reply,
        h("div", { style: "display:flex;flex-wrap:wrap;gap:12px;align-items:center" },
          h("button", { class: "tab", text: "Enregistrer le message", onclick: async function () {
            var r = await sb.from("applications").update({ reply: reply.value || null }).eq("id", a.id);
            msg.textContent = r.error ? "Erreur : " + r.error.message : "Message enregistré.";
          } }), msg));
    }
    load();
    var ch = sb.channel("apps").on("postgres_changes", { event: "INSERT", schema: "public", table: "applications" }, function (p) {
      banner.hidden = false; banner.textContent = "Nouvelle candidature : " + p.new.artist; load();
    }).subscribe();
    chans.push(ch);
  }
  function chatPanel(panel, user, me) {
    var msgs = h("div", { class: "msgs" }), seen = {};
    function add(m) {
      if (seen[m.id]) return; seen[m.id] = 1;
      var mine = m.author === user.id;
      msgs.appendChild(h("div", { class: "m" + (mine ? " me" : "") },
        h("small", { text: m.author_name + " · " + fmt(m.created_at) }),
        h("p", { text: m.body, style: "background:" + (COLORS[m.author_name] || "#1A2B25") + ";color:" + (m.author_name === "ID" ? "#0B0D0C" : "#fff") })));
      msgs.scrollTop = msgs.scrollHeight;
    }
    var input = h("input", { class: "in", placeholder: "Écris un message à l'équipe…", maxlength: "2000", "aria-label": "Ton message" });
    var form = h("form", { class: "send", onsubmit: async function (e) {
      e.preventDefault();
      var t = input.value.trim(); if (!t) return;
      var r = await sb.from("messages").insert({ author_name: me, body: t }).select().single();
      if (r.error) { alert("Envoi impossible : " + r.error.message); return; }
      input.value = ""; add(r.data);
    } }, input, h("button", { class: "btn dk lab", type: "submit", text: "Envoyer" }));
    panel.appendChild(h("div", { class: "chat" }, msgs, form));
    sb.from("messages").select("*").order("created_at", { ascending: true }).limit(300).then(function (r) { (r.data || []).forEach(add); });
    var ch = sb.channel("msgs").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, function (p) { add(p.new); }).subscribe();
    chans.push(ch);
  }

  /* ---------- routeur ---------- */
  function route() {
    if (sb) chans.forEach(function (c) { sb.removeChannel(c); });
    chans = [];
    var r = (location.hash || "#/").replace("#/", "") || "home";
    var scroll = null, name = r;
    if (r === "soirees") { name = "home"; scroll = "soirees"; }
    if (r === "communaute") { name = "home"; scroll = "communaute"; }
    if (r === "battle-form") { name = "battle"; scroll = "inscription-battle"; }
    var t = document.getElementById("t-" + (name === "reglement" ? "rules" : name === "suivi" ? "track" : name === "equipe" ? "team" : name));
    if (!t) { name = "home"; t = document.getElementById("t-home"); }
    app.replaceChildren(t.content.cloneNode(true));
    app.querySelectorAll("form[data-kind]").forEach(bindForm);
    if (name === "suivi") bindTrack();
    if (name === "equipe") teamPage();
    var f = app.querySelector("form[data-kind=battle]");
    if (scroll === "inscription-battle" && f) f.scrollIntoView({ block: "center" });
    else if (scroll) { var el = document.getElementById(scroll); if (el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
    document.querySelectorAll("#nav a").forEach(function (a) { a.className = a.className.replace(" cur", ""); if (a.getAttribute("href") === "#/" + r && !a.classList.contains("btn")) a.className += " cur"; });
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
